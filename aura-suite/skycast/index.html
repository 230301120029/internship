 try{const c=D.f.current,d=D.f.daily;o.textContent='✨ '+await ai(`Weather data: ${JSON.stringify({city:D.place.name,unit:D.unit,temp:c.temperature_2m,feels:c.apparent_temperature,condition:w(c.weather_code)[0],hi:d.temperature_2m_max[0],lo:d.temperature_2m_min[0],uv:d.uv_index_max[0],rain12:rain12(),wind:c.wind_speed_10m})}\nQuestion: ${q}`)}catch{o.textContent='💡 '+local(q)}}
$('#out').addEventListener('click',e=>{if(e.target.id=='ab')ask()});$('#out').addEventListener('keydown',e=>{if(e.target.id=='aq'&&e.key=='Enter')ask()});
function radar(){const P=D.place;fetch('https://api.rainviewer.com/public/weather-maps.json').then(r=>r.json()).then(m=>{const o=document.getElementById('rd');if(!o)return;const fr=m.radar.past.at(-1),z=6,n=2**z,la=P.latitude*Math.PI/180,x=(P.longitude+180)/360*n,y=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n,tx=Math.floor(x),ty=Math.floor(y);let s='';
 for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)s+=`<div style="position:relative"><img alt="" loading="lazy" src="https://tile.openstreetmap.org/${z}/${tx+dx}/${ty+dy}.png" style="filter:brightness(.7) saturate(.6)"><img alt="" loading="lazy" src="${m.host}${fr.path}/256/${z}/${tx+dx}/${ty+dy}/2/1_1.png" style="position:absolute;inset:0;opacity:.85"></div>`;
 o.innerHTML=`<div style="position:relative;display:grid;grid-template-columns:repeat(3,1fr);max-width:480px;margin:auto;border-radius:18px;overflow:hidden">${s}<span style="position:absolute;left:${(x-tx+1)/3*100}%;top:${(y-ty+1)/3*100}%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#fde047;box-shadow:0 0 16px #fde047"></span></div><p class="sub">Live radar (rain in blue/green/red). © OpenStreetMap, RainViewer</p>`}).catch(()=>{const o=document.getElementById('rd');if(o)o.textContent='Radar is unavailable right now.'})}
const _r2=render;render=function(){_r2();$('#out .grid').insertAdjacentHTML('beforeend','<section class="glass card wide"><h3>Ask Skycast</h3><div class="top"><input id="aq" maxlength="200" aria-label="Ask about the weather" placeholder="Do I need an umbrella? What should I wear?"><button id="ab">Ask</button></div><p id="ar" class="sub" aria-live="polite"></p></section><section class="glass card wide"><h3>Radar</h3><div id="rd" class="sub">Loading radar…</div></section>');radar()};
