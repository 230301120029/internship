<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Suite</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#0f172a,#4c1d95,#be185d,#0284c7);background-size:300% 300%;animation:g 20s ease infinite}@keyframes g{50%{background-position:100% 100%}}
main{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));max-width:720px;padding:20px}h1{grid-column:1/-1;text-align:center;margin:0;font-size:34px}
a{color:#fff;text-decoration:none;padding:34px 24px;border-radius:26px;text-align:center;background:linear-gradient(135deg,#ffffff30,#ffffff0d);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid #ffffff40;box-shadow:inset 0 1px 0 #ffffff55,0 14px 34px #0004;transition:.3s}a:hover{transform:translateY(-4px);box-shadow:0 0 44px #c084fcaa}a span{display:block;font-size:56px}a b{font-size:22px}a small{display:block;opacity:.8;margin-top:6px}</style></head>
<body><main><h1>Aura Suite</h1><a href="skycast/"><span>⛅</span><b>Skycast</b><small>Live weather</small></a><a href="taskly/"><span>✅</span><b>Taskly</b><small>Smart to-do</small></a></main></body></html>
