$('#board').onclick=e=>{const k=e.target.closest('.kc');if(!k)return;const t=tasks.find(x=>x.id==k.dataset.id),n={todo:'doing',doing:'done',done:'todo'}[st(t)];setS(t,n)};
$('#board').ondragstart=e=>{const k=e.target.closest('.kc');if(k)e.dataTransfer.setData('text/plain',k.dataset.id)};
$('#board').ondragover=e=>{if(e.target.closest('.col'))e.preventDefault()};
$('#board').ondrop=e=>{const c=e.target.closest('.col');if(!c)return;e.preventDefault();const t=tasks.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(t)setS(t,c.dataset.c)};
const _r2=render;render=function(){_r2();$('#list').hidden=view=='board';$('#board').hidden=view!='board';$('#vw').textContent=view=='board'?'☰ List view':'▦ Board view';
 if(view=='board'){const v=tasks.filter(t=>(!tagF||t.tags.includes(tagF))&&(!q||t.t.toLowerCase().includes(q)));$('#board').innerHTML=[['todo','To do'],['doing','Doing'],['done','Done']].map(([c,l])=>`<div class="col" data-c="${c}"><h3>${l} (${v.filter(t=>st(t)==c).length})</h3>${v.filter(t=>st(t)==c).map(t=>`<div class="kc" draggable="true" data-id="${t.id}" title="Click to move forward">${['','🟢','🟡','🔴'][t.p]} ${esc(t.t)}</div>`).join('')}</div>`).join('')}};
render();pf();
</script></body></html>
